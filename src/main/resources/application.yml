server:
  port: 8080

spring:
  application:
    name: note-workshop
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/note_workshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  web:
    resources:
      static-locations: classpath:/static/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: note-workshop-demo-secret-key-change-me-0123456789abcdef
    expire-days: 7
  upload-dir: ./uploads

logging:
  level:
    root: info
    com.noteworkshop: debug
